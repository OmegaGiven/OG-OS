[dependencies.iced]
version = "0.13"
default-features = false
# iced's own crate defaults enable BOTH "wgpu" and "tiny-skia" (see its
# Cargo.toml: default = ["wgpu", "tiny-skia", ...]). Every consumer of
# iced_layershell (og-bar, og-wallpaper) explicitly opts out of wgpu via
# their own `iced = { default-features = false, features = ["tiny-skia",
# ...] }` line, believing that settles it — it doesn't. Cargo unions
# feature requests across the whole dependency graph; this crate's own
# unqualified `iced = "0.13"` (defaults on) was silently re-enabling wgpu
# for every consumer regardless, no matter what they asked for.
#
# Confirmed live, not theoretical: og-bar was found crashing on this
# machine roughly every 45-90 seconds, continuously, for 3+ days
# (4000+ watchdog-triggered restarts) — coredumps showed a real hang
# inside wgpu_hal::vulkan::Queue::present -> wl_display_dispatch_queue,
# blocked in ppoll and never returning, killed only by the watchdog
# added for an unrelated bug. wgpu's Vulkan swapchain keeps its own
# Wayland connection/event handling entirely separate from
# layershellev's — the DPMS-wake `zwlr_layer_surface_v1.closed` fix in
# this same vendor tree doesn't and can't reach into it. Disabling wgpu
# here removes the whole failure class instead of chasing it inside
# wgpu/RADV.

[dependencies.iced_core]
version = "0.13"

[dependencies.iced_futures]
version = "0.13"

[dependencies.iced_graphics]
version = "0.13"

[dependencies.iced_layershell_macros]
