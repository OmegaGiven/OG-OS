[workspace]
resolver = "2"
members = [
    "crates/og-config",
    "crates/og-drag",
    "crates/og-theme",
    "crates/og-wayland",
    "crates/og-wallpaper-core",
    "apps/og-apps",
    "apps/og-bar",
    "apps/og-clip",
    "apps/og-files",
    "apps/og-hotkeys",
    "apps/og-notif-center",
    "apps/og-notify",
    "apps/og-phone-audio",
    "apps/og-search",
    "apps/og-settings",
    "apps/og-voice",
    "apps/og-wallpaper",
    "apps/og-wallpaper-studio",
]

# Suite-wide patched crates — see vendor/README.md.
[patch.crates-io]
layershellev = { path = "vendor/layershellev-0.13.7" }
iced_layershell = { path = "vendor/iced_layershell-0.13.7" }
# winit without its private macOS window-blur API, which the Mac App Store
# rejects (og-files' App Store build); see apps/og-files/third_party/README.md
winit = { path = "apps/og-files/third_party/winit" }
