#
# /etc/pacman.conf
#
# See the pacman.conf(5) manpage for option and repository directives

#
# GENERAL OPTIONS
#
[options]
HoldPkg     = pacman glibc
Architecture = auto

ParallelDownloads = 5

SigLevel    = Required DatabaseOptional
LocalFileSigLevel = Optional

# NOTE: You must run `pacman-key --init` before first using pacman; the local
# keyring can then be populated with the keys of all official Arch Linux
# packagers with `pacman-key --populate archlinux`.

#
# REPOSITORIES
#

# OG-suite own tools (og-bar, og-settings, og-search, og-clip,
# og-notif-center, og-notify, og-files, og-links, og-apps, og-scripts),
# built via ./pkgbuilds/<name>/PKGBUILD and repo-add'ed, then published to
# a real hosted repo (see pkgbuilds/publish.sh) — same URL an installed
# system's own /etc/pacman.conf points at (install-ogos.sh), so what
# mkarchiso bakes into the ISO and what an installed system can later
# `pacman -Syu` come from the same place, not two repos that can drift.
# Listed first so it takes precedence on any name collision.
[ogos]
SigLevel = Optional TrustAll
Server = https://omegagiven.github.io/OG-os-repo/x86_64

[core]
Include = /etc/pacman.d/mirrorlist

[extra]
Include = /etc/pacman.d/mirrorlist

# If you want to run 32 bit applications on your x86_64 system,
# enable the multilib repositories as required here.

#[multilib]
#Include = /etc/pacman.d/mirrorlist
