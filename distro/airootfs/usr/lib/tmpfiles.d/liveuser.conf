# liveuser's home is baked into the ISO under /home/liveuser (owned by
# root:root at build time — mkarchiso/fakeroot has no reason to know the
# uid sysusers.d assigns at boot) — Z recursively fixes ownership once
# systemd-sysusers has actually created the account, before lightdm
# autologins into it.
d /home/liveuser 0750 liveuser liveuser -
Z /home/liveuser - liveuser liveuser -
