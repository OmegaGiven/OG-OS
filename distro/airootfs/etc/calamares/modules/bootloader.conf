# OG-OS: systemd-boot, matching install-ogos.sh's already-validated
# bootctl-based setup. systemd-boot auto-discovers other OSes'
# bootmgfw.efi / other loader entries that live on the same ESP —
# no os-prober/grub-mkconfig step needed for dual-boot to show up in
# the boot menu, unlike GRUB.
efiBootLoader: "systemd-boot"

kernelSearchPath: "/usr/lib/modules"
kernelPattern: "^vmlinuz.*"

loaderEntries:
  - "timeout 5"
  - "console-mode max"

kernelParams: [ ]

installEFIFallback: true
installHybridGRUB: false
