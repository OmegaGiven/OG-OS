# unpackfs copies the ENTIRE live filesystem onto the target, including
# liveuser's own account/home — this module (userdel) removes it from
# the installed system afterward. Does not, by itself, clean up
# liveuser-specific config files that are wheel-group-wide rather than
# account-specific (sudoers.d/liveuser grants NOPASSWD to all of %wheel,
# which the new real user is also a member of) — see shellprocess.conf
# for that part.
username: liveuser
