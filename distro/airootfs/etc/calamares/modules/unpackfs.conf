# OG-OS: copy this live session's own squashfs onto the target disk.
# Path matches archiso's install_dir=ogos convention — see
# profiledef.sh and the xorriso listing that confirmed
# /ogos/x86_64/airootfs.sfs on the built ISO.
#
# This copy is the bulk of install time (measured 75 s of a 107 s
# install with the old xz squashfs; see distro/testing/README.md,
# "Install speed"). unpackfs reads through a loop-mounted squashfs with a
# single rsync, i.e. one kernel decompression stream — which is why
# profiledef.sh now builds the squashfs with zstd (single-stream decode
# ~5x faster than xz) instead of xz.
#
# The kernel: archiso keeps the live kernel/initramfs OUTSIDE the
# squashfs (in the ISO's boot area). This used to be a second unpack
# entry copying /run/archiso/bootmnt/ogos/boot/x86_64 to /boot, which
# also wrote the 230+ MB live archiso initramfs onto the ESP just for
# mkinitcpio to overwrite it. shellprocess@earlycleanup (target-setup
# early) now installs /boot/vmlinuz-linux from the package's own
# /usr/lib/modules/<kver>/vmlinuz, which IS inside the squashfs.
unpack:
    -   source: "/run/archiso/bootmnt/ogos/x86_64/airootfs.sfs"
        sourcefs: "squashfs"
        destination: ""
        # Offline package copy for install-ogos.sh (the pacstrap-based
        # script installer); never needed on an installed system.
        exclude: [ "/root/ogos-repo/" ]
