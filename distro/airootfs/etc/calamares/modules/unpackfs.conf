# OG-OS: copy this live session's own squashfs onto the target disk.
# Path matches archiso's install_dir=ogos convention — see
# profiledef.sh and the xorriso listing that confirmed
# /ogos/x86_64/airootfs.sfs on the built ISO.
unpack:
    -   source: "/run/archiso/bootmnt/ogos/x86_64/airootfs.sfs"
        sourcefs: "squashfs"
        destination: ""
    # Real gap found via an actual failed install: archiso keeps the
    # live kernel/initramfs OUTSIDE the squashfs, in the ISO's own boot
    # area — they were never inside "/" to begin with, so the entry
    # above never puts vmlinuz-linux on the target at all. Without it,
    # Calamares' initcpio module fails regenerating the initramfs for
    # the installed system: "ERROR: Invalid option -k --
    # '/boot/vmlinuz-linux' must be readable". ucode images (amd-ucode/
    # intel-ucode) are fine as-is -- confirmed via xorriso those are
    # already inside the squashfs (installed to /boot normally by their
    # packages, unlike the kernel/initramfs which archiso's own build
    # process treats specially).
    -   source: "/run/archiso/bootmnt/ogos/boot/x86_64"
        sourcefs: "file"
        destination: "/boot"
