# OG-OS overrides — kpmcore drives the "Erase / Replace / Install
# alongside / Manual" choice page itself (this is what gives us safe
# dual-boot: shrink an existing partition, reuse an existing ESP), so
# most of the shipped default is fine as-is. Only the ESP mount point
# changes, to match install-ogos.sh's bash-installer convention
# (single /boot=ESP, systemd-boot) already validated end-to-end.
efi:
    mountPoint:         "/boot"
    recommendedSize:    300MiB
    minimumSize:        100MiB
    label:              "OGOSESP"

userSwapChoices:
    - none
    - small
    - suspend
    - file

drawNestedPartitions:   false
alwaysShowPartitionLabels: true
initialPartitioningChoice: none
