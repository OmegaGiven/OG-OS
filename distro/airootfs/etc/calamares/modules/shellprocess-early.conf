# Runs right after unpackfs, before initcpiocfg/initcpio — see the
# comment in settings.conf's `instances:` block for why this exists.
#
# /usr/local/lib/ogos-installer/target-setup early (in the target chroot):
#   - removes the archiso-only mkinitcpio.conf.d drop-in and writes the
#     stock preset from /usr/share/mkinitcpio/hook.preset (upstream
#     default: PRESETS=('default') only — no 200+ MB fallback image, so
#     the initcpio step builds exactly ONE initramfs);
#   - installs /boot/vmlinuz-linux from /usr/lib/modules/<kver>/vmlinuz
#     (archiso keeps the live kernel outside the squashfs);
#   - sets kernel-install layout=other when the ESP is /boot, so the
#     bootloader step doesn't build a second initramfs (see the script).
# All plain file operations: well under a second.
dontChroot: false
timeout: 30
script:
    - "/usr/local/lib/ogos-installer/target-setup early"
