# Runs right after unpackfs, before initcpiocfg/initcpio — see the
# comment in settings.conf's `instances:` block for why this exists.
#
# Restores the stock Arch `linux.preset` (the real content, not a
# guess — this is upstream's own default file for the `linux` package)
# and removes the archiso-only mkinitcpio.conf.d drop-in, so
# initcpiocfg's own hook auto-detection generates a normal HOOKS= line
# instead of keeping archiso/archiso_loop_mnt hooks that don't apply
# (and whose backing scripts may not even be relevant) on a real
# installed system.
# dontChroot: false runs commands inside the target's own chroot
# (matching the rest of this suite's shellprocess.conf convention) --
# paths below are plain /etc/... , not ${ROOT}/etc/..., same as that
# file.
dontChroot: false
timeout: 10
script:
    - command: |
        cat > /etc/mkinitcpio.d/linux.preset <<'PRESET_EOF'
        # mkinitcpio preset file for the 'linux' package

        #ALL_config="/etc/mkinitcpio.conf"
        ALL_kver="/boot/vmlinuz-linux"

        PRESETS=('default' 'fallback')

        #default_config="/etc/mkinitcpio.conf"
        default_image="/boot/initramfs-linux.img"
        #default_options=""

        #fallback_config="/etc/mkinitcpio.conf"
        fallback_image="/boot/initramfs-linux-fallback.img"
        fallback_options="-S autodetect"
        PRESET_EOF
      timeout: 10
    - "-rm -f /etc/mkinitcpio.conf.d/archiso.conf"
