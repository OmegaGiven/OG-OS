# OG-OS: only overriding the hostname suggestion — the shipped default's
# "derp-${cpu}" is a placeholder value, not something to ship. Groups/
# sudoers/autologin config all match our own conventions already
# (wheel sudoers, same as install-ogos.sh and the live liveuser setup).
hostname:
  location: EtcFile
  writeHostsFile: true
  template: "ogos-${cpu}"
  forbidden_names: [ localhost ]
