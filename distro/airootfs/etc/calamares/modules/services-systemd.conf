# OG-OS: system services to enable on the installed system, beyond what
# the live image already has enabled (iwd, systemd-networkd/-resolved,
# lightdm via display-manager.service — those carry over through
# unpackfs as-is). The shipped default enables nothing, which left
# bluetooth.service (bluez is in packages.x86_64, og-settings has a
# Bluetooth page) disabled on every install. Enabling a unit in the
# chroot is a symlink: no measurable install time.
units:
    - name: "bluetooth"
      action: "enable"
      mandatory: false
