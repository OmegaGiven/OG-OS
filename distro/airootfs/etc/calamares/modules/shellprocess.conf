# OG-OS post-install finalization, run in the target chroot
# (dontChroot: false), AFTER the bootloader module (see settings.conf).
#
# /usr/local/lib/ogos-installer/target-setup final strips the
# live-medium-only state that unpackfs's raw copy carries over and that
# removeuser's `userdel` doesn't touch — most importantly:
#   - sudoers.d/zz-liveuser: NOPASSWD for all of %wheel (the new user is
#     in wheel too — passwordless root on every install if left);
#   - getty@tty1 root autologin, sshd's PermitRootLogin yes drop-in,
#     sysusers.d/tmpfiles.d entries that recreate liveuser at every boot,
#     volatile journald / no-suspend logind drop-ins, livecd-* units,
#     /root/ogos-repo (only install-ogos.sh's pacstrap path uses it);
# then sets up what an installed system needs instead:
#   - pacman keyring generated once on first boot (persisted on disk),
#   - the hosted [ogos] repo in /etc/pacman.conf (update channel),
#   - a standard Arch systemd-boot entry (/vmlinuz-linux +
#     /initramfs-linux.img + Calamares' /etc/kernel/cmdline) that the
#     stock pacman hooks keep valid across kernel updates.
# No package transactions, no downloads: well under a second.
dontChroot: false
timeout: 30
script:
    - "/usr/local/lib/ogos-installer/target-setup final"
