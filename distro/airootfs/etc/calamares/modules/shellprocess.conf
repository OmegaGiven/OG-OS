# OG-OS post-unpackfs cleanup, run in the target chroot (dontChroot: false).
#
# unpackfs's raw filesystem copy brings over live-session-only state that
# removeuser's userdel doesn't touch, because it isn't scoped to the
# liveuser *account* — it's wheel-*group*-wide, and the newly created
# real user is also in wheel (see users.conf/defaultGroups):
#   - sudoers.d/zz-liveuser grants NOPASSWD to all of %wheel — a
#     live-medium convenience (liveuser has a known published password,
#     not a security boundary) that would otherwise silently grant
#     passwordless root to every installed system's first user. Real
#     security hole if left. (Filename is zz-liveuser, not liveuser —
#     see that file's own comment: it has to sort after sudoers.d/wheel
#     for its NOPASSWD grant to actually take effect on the live medium
#     in the first place, sudo's file-glob order otherwise lets wheel's
#     password-required rule silently win for liveuser too.)
dontChroot: false
timeout: 10
script:
    - "-rm -f /etc/sudoers.d/zz-liveuser"
    # /root/ogos-repo/ (~50MB of .pkg.tar.zst) only exists for
    # install-ogos.sh's pacstrap path — dead weight on an install done
    # through Calamares/unpackfs instead.
    - "-rm -rf /root/ogos-repo"
