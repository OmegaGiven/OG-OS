# OG-OS Calamares top-level config — phase 5 (OS-PLAN.md).
# Install mechanism: unpackfs (copy this live session's own squashfs onto
# the target disk), not a fresh pacstrap — matches how most squashfs-based
# Calamares distros (Manjaro, etc.) work: no network needed to install,
# and the installed system is byte-identical to this tested live image.
modules-search: [ local ]

# unpackfs copies the ENTIRE live squashfs onto the target, including
# airootfs/etc/mkinitcpio.d/linux.preset and
# airootfs/etc/mkinitcpio.conf.d/archiso.conf — files that only exist to
# build THIS live ISO's own initramfs at mkarchiso build time, but end
# up baked into the squashfs and carried onto every install. Left in
# place, Calamares' own `initcpio` module (which regenerates the
# initramfs for the newly-installed kernel) fails: the archiso preset's
# `-k /boot/vmlinuz-linux` path assumes the archiso build environment,
# not a normal installed system ("ERROR: Invalid option -k --
# '/boot/vmlinuz-linux' must be readable"). shellprocess@earlycleanup
# below restores the real content before initcpiocfg/initcpio run.
instances:
- id: earlycleanup
  module: shellprocess
  config: shellprocess-early.conf

sequence:
- show:
  - welcome
  - locale
  - keyboard
  - partition
  - users
  - summary
- exec:
  - partition
  - mount
  - unpackfs
  - shellprocess@earlycleanup
  - machineid
  - fstab
  - locale
  - keyboard
  - localecfg
  - initcpiocfg
  - initcpio
  - users
  - removeuser
  - shellprocess
  - displaymanager
  - networkcfg
  - hwclock
  - services-systemd
  - bootloader
  - umount
- show:
  - finished

branding: ogos
prompt-install: true
dont-chroot: false
oem-setup: false
disable-cancel: false
disable-cancel-during-exec: true
hide-back-and-next-during-exec: false
quit-at-end: false
