[package]
name = "og-links"
version = "0.1.0"
edition = "2021"

# og-links has no dependency on OG-toolkit's shared crates, so it isn't a
# workspace member — but its PKGBUILD's $srcdir now lives physically
# nested inside the OG-toolkit tree (distro/pkgbuilds/og-links/src/), so
# cargo's upward workspace search finds the real root Cargo.toml and
# refuses to build ("believes it's in a workspace when it's not") unless
# told explicitly to stop looking. This empty table is that stop.
[workspace]

[[bin]]
name = "og-links"
path = "src/main.rs"

[dependencies]
axum = { version = "0.7", features = ["form"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
