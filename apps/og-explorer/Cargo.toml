[package]
name = "og-explorer"
version = "0.1.0"
edition = "2021"
description = "OG Explorer — file manager with built-in viewers/editors (successor to og-files)"

[[bin]]
name = "og-explorer"
path = "src/main.rs"

# Deliberately no og-* path deps: this app must build and run standalone,
# outside the OG-OS distro. Suite integration (og-config theme, og-wayland
# drag-out) comes in behind the optional `og-suite` feature — see SPEC.md §7.
[dependencies]
iced = { version = "0.13", features = ["image", "tokio", "advanced", "canvas"] }
tokio = { version = "1.52.3", features = ["fs", "rt", "sync", "time", "io-util"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
mime_guess = "2"
hayro = "0.7"
lopdf = { version = "0.45", default-features = false }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp", "tiff"] }
ureq = { version = "2.12", default-features = false, features = ["tls"] }
iced_fonts = { version = "0.1", features = ["bootstrap"] }
zbus = { version = "5", default-features = false, features = ["tokio"] }
notify = "8"
og-wayland = { path = "../../crates/og-wayland", optional = true }
symphonia = { version = "0.5", features = ["mp3", "aac", "alac", "isomp4"] }
cpal = "0.16"
lofty = "0.22"
hound = "3.5"

og-config = { path = "../../crates/og-config", optional = true }
og-theme = { path = "../../crates/og-theme", optional = true }

[features]
# OG-OS integration: suite palette (live reload) and, via og-wayland,
# drag-and-drop with other apps. Off = fully standalone build.
og-suite = ["dep:og-config", "dep:og-theme", "dep:og-wayland"]

[dev-dependencies]
tokio = { version = "1.52.3", features = ["macros", "rt", "time", "sync", "fs"] }
