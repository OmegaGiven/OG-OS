[package]
name = "og-settings"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "og-settings"
path = "src/main.rs"

[dependencies]
og-config = { path = "../../crates/og-config" }
og-theme = { path = "../../crates/og-theme" }
og-wallpaper-core = { path = "../../crates/og-wallpaper-core" }
iced = { version = "0.13", default-features = false, features = ["wgpu", "tiny-skia", "advanced", "tokio", "canvas", "image"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
chrono = { version = "0.4", features = ["serde"] }
portable-pty = "0.8"
vt100 = "0.15"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros"] }
rfd = "0.15"
