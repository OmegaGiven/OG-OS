[package]
name = "og-wallpaper"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "og-wallpaper"
path = "src/main.rs"

[dependencies]
og-config = { path = "../../crates/og-config" }
og-theme = { path = "../../crates/og-theme" }
og-wallpaper-core = { path = "../../crates/og-wallpaper-core" }
iced = { version = "0.13", default-features = false, features = ["wgpu", "tiny-skia", "canvas", "tokio", "image"] }
iced_layershell = "0.13.7"
rand = "0.8"
# procedural scenes (circuit, tokyo): generated on the CPU, rendered by a lean
# Wayland + EGL/GLES 3 client (src/direct/) instead of iced
tiny-skia = "0.11"
bytemuck = { version = "1", features = ["derive"] }
serde_json = "1"
wayland-client = "0.31"
wayland-backend = { version = "0.3", features = ["client_system"] }
wayland-protocols = { version = "0.32", features = ["client", "staging"] }
wayland-protocols-wlr = { version = "0.3", features = ["client"] }
wayland-egl = "0.32"
khronos-egl = { version = "6", features = ["static"] }
glow = "0.13"
libc = "0.2"

