[package]
name = "og-notif-center"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "og-notif-center"
path = "src/main.rs"

[dependencies]
og-config = { path = "../../crates/og-config" }
og-theme = { path = "../../crates/og-theme" }
iced_layershell = "0.13.7"
libc = "0.2"
tokio = { version = "1", features = ["signal"] }
iced = { version = "0.13", default-features = false, features = ["wgpu", "tiny-skia", "advanced", "tokio", "image", "svg", "lazy"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
