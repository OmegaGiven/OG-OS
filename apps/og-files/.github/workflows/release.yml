name: Release

# Push a tag like v0.1.0 to build every platform and publish a GitHub
# Release with downloadable files. "Run workflow" (manual) builds the same
# files as workflow artifacts without publishing a release.
#
#   Linux    .AppImage (any distro), .deb (Debian/Ubuntu), .rpm (Fedora/
#            openSUSE), .pkg.tar.zst + PKGBUILD (Arch), portable .tar.gz
#            — x86_64 and aarch64
#   macOS    .dmg and .zip — Apple Silicon and Intel; signed and notarized
#            when the Developer ID secrets are set, ad-hoc signed otherwise
#   Windows  installer (.exe) and portable .zip — x64 and ARM64
#
# The Mac App Store build is a separate, manual workflow (appstore.yml).
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  linux:
    name: Linux ${{ matrix.arch }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x86_64, os: ubuntu-24.04, deb: amd64 }
          - { arch: aarch64, os: ubuntu-24.04-arm, deb: arm64 }
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build dependencies (+ libmpv to bundle)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libxkbcommon-dev libwayland-dev libasound2-dev libvulkan-dev \
            libmpv-dev libfuse2t64 file rpm
      - run: cargo build --locked --release
      - name: Stage shared files
        shell: bash
        run: |
          set -euo pipefail
          V=$(cargo pkgid | sed 's/.*[#@]//')
          echo "V=$V" >> "$GITHUB_ENV"
          S=stage
          mkdir -p $S dist
          cp target/release/og-files packaging/linux/og-files.desktop \
             packaging/linux/com.omegagiven.ogfiles.metainfo.xml \
             packaging/icons/og-files.png packaging/icons/og-files.svg LICENSE $S/
      - name: AppImage (libmpv bundled)
        shell: bash
        run: |
          set -euo pipefail
          A=${{ matrix.arch }}
          curl -fsSLo linuxdeploy https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-$A.AppImage
          chmod +x linuxdeploy
          LIBMPV=$(ldconfig -p | awk '/libmpv\.so\.2 /{print $NF; exit}')
          # linuxdeploy copies libmpv and its whole dependency tree into the
          # AppImage; the AppRun puts usr/lib on the library path so
          # og-files' runtime dlopen("libmpv.so.2") finds the bundled copy
          install -Dm644 packaging/linux/com.omegagiven.ogfiles.metainfo.xml \
            AppDir/usr/share/metainfo/com.omegagiven.ogfiles.metainfo.xml
          APPIMAGE_EXTRACT_AND_RUN=1 LDAI_OUTPUT=dist/OG_Files-$V-$A.AppImage ./linuxdeploy \
            --appdir AppDir -e target/release/og-files \
            -d packaging/linux/og-files.desktop -i packaging/icons/og-files.png \
            --library "$LIBMPV" --output appimage
      - name: Debian package (uses the system libmpv)
        shell: bash
        run: |
          set -euo pipefail
          D=deb
          install -Dm755 stage/og-files $D/usr/bin/og-files
          install -Dm644 stage/og-files.desktop $D/usr/share/applications/og-files.desktop
          install -Dm644 stage/com.omegagiven.ogfiles.metainfo.xml $D/usr/share/metainfo/com.omegagiven.ogfiles.metainfo.xml
          install -Dm644 stage/og-files.png $D/usr/share/icons/hicolor/512x512/apps/og-files.png
          install -Dm644 stage/og-files.svg $D/usr/share/icons/hicolor/scalable/apps/og-files.svg
          install -Dm644 LICENSE $D/usr/share/doc/og-files/copyright
          mkdir -p $D/DEBIAN
          printf '%s\n' \
            "Package: og-files" "Version: $V" "Architecture: ${{ matrix.deb }}" \
            "Maintainer: OmegaGiven <https://github.com/OmegaGiven/og-files>" \
            "Depends: libc6, libasound2t64 | libasound2, libxkbcommon0, libvulkan1" \
            "Recommends: libmpv2, udisks2, rclone, fuse3" \
            "Section: utils" "Priority: optional" \
            "Homepage: https://github.com/OmegaGiven/og-files" \
            "Description: file manager with built-in viewers and editors" \
            " OG Files browses, previews and edits documents, PDFs, images," \
            " video, audio, archives and more in one app." > $D/DEBIAN/control
          dpkg-deb --root-owner-group --build $D dist/og-files_${V}_${{ matrix.deb }}.deb
      - name: RPM package (Fedora, openSUSE; uses the system libmpv)
        shell: bash
        run: |
          set -euo pipefail
          rpmbuild -bb --define "_version $V" --define "_srcdir $PWD/stage" \
            --define "_topdir $PWD/rpmbuild" --target ${{ matrix.arch }} packaging/linux/og-files.spec
          cp rpmbuild/RPMS/*/og-files-*.rpm dist/
      - name: Portable tarball
        shell: bash
        run: |
          set -euo pipefail
          N=og-files-$V-linux-${{ matrix.arch }}
          mkdir -p "$N"
          cp stage/* packaging/linux/install.sh "$N/"
          [ -f README.md ] && cp README.md "$N/"
          tar -czf "dist/$N.tar.gz" "$N"
          ls -la dist
      - uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.arch }}
          path: dist/*

  arch:
    name: Arch Linux package
    needs: linux
    runs-on: ubuntu-24.04
    container: archlinux:base-devel
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: linux-*
          path: linux
          merge-multiple: true
      - name: PKGBUILD + .pkg.tar.zst (x86_64)
        shell: bash
        run: |
          set -euo pipefail
          X=$(ls linux/og-files-*-linux-x86_64.tar.gz)
          V=$(basename "$X" | sed -E 's/og-files-(.*)-linux-x86_64.tar.gz/\1/')
          sum() { sha256sum "$1" | cut -d' ' -f1; }
          mkdir -p dist build
          sed -e "s/@VERSION@/$V/" \
              -e "s/@SHA256_X86_64@/$(sum "$X")/" \
              -e "s/@SHA256_AARCH64@/$(sum linux/og-files-$V-linux-aarch64.tar.gz)/" \
              packaging/linux/arch/PKGBUILD.in > build/PKGBUILD
          cp build/PKGBUILD dist/PKGBUILD
          # makepkg finds the tarball already next to the PKGBUILD and
          # verifies it against the checksum instead of downloading
          cp "$X" build/
          useradd -m builder
          chown -R builder build
          su builder -c "cd build && makepkg --nodeps --noconfirm"
          cp build/*.pkg.tar.zst dist/
          ls -la dist
      - uses: actions/upload-artifact@v4
        with:
          name: arch
          path: dist/*

  macos:
    name: macOS ${{ matrix.arch }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: arm64, os: macos-14 }
          - { arch: x86_64, os: macos-15-intel }
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: libmpv to bundle
        run: brew install mpv dylibbundler
      - run: cargo build --locked --release
      - name: Assemble .app (libmpv in Frameworks)
        run: |
          set -euo pipefail
          V=$(cargo pkgid | sed 's/.*[#@]//')
          echo "V=$V" >> "$GITHUB_ENV"
          APP="dist/OG Files.app"
          FW="$APP/Contents/Frameworks"
          mkdir -p "$APP/Contents/MacOS" "$APP/Contents/Resources" "$FW"
          cp target/release/og-files "$APP/Contents/MacOS/og-files"
          sed -e "s/@VERSION@/$V/g" -e "s/@BUILD@/$V/g" packaging/macos/Info.plist > "$APP/Contents/Info.plist"
          cp packaging/icons/og-files.icns "$APP/Contents/Resources/"
          cp LICENSE "$APP/Contents/Resources/"
          # libmpv + every Homebrew dylib it needs, rewritten to load from
          # the bundle (og-files dlopens Contents/Frameworks/libmpv.2.dylib)
          cp "$(brew --prefix mpv)/lib/libmpv.2.dylib" "$FW/"
          chmod u+w "$FW/libmpv.2.dylib"
          install_name_tool -id @rpath/libmpv.2.dylib "$FW/libmpv.2.dylib"
          dylibbundler -of -b -cd -x "$FW/libmpv.2.dylib" -d "$FW/" -p @loader_path/
      - name: Sign (Developer ID when available, else ad-hoc)
        env:
          DEVID_P12: ${{ secrets.APPLE_DEVID_CERTIFICATE }}
          DEVID_PW: ${{ secrets.APPLE_DEVID_CERTIFICATE_PASSWORD }}
          IDENTITY: ${{ secrets.APPLE_DEVID_SIGNING_IDENTITY }}
          KC_PW: ${{ github.run_id }}${{ github.run_attempt }}
        run: |
          set -euo pipefail
          APP="dist/OG Files.app"
          if [ -n "$DEVID_P12" ]; then
            security create-keychain -p "$KC_PW" build.keychain
            security default-keychain -s build.keychain
            security unlock-keychain -p "$KC_PW" build.keychain
            security set-keychain-settings -t 3600 -u build.keychain
            echo "$DEVID_P12" | base64 --decode > devid.p12
            security import devid.p12 -k build.keychain -P "$DEVID_PW" -T /usr/bin/codesign
            rm devid.p12
            security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KC_PW" build.keychain
            SIGN=(--force --timestamp --options runtime --sign "$IDENTITY")
            echo "NOTARIZE=1" >> "$GITHUB_ENV"
          else
            # no Apple developer secrets: ad-hoc signature, users approve
            # the app once (right-click → Open)
            SIGN=(--force --sign -)
          fi
          find "$APP/Contents/Frameworks" -name '*.dylib' -exec codesign "${SIGN[@]}" {} \;
          codesign "${SIGN[@]}" "$APP"
          codesign --verify --strict --verbose=2 "$APP"
      - name: Notarize
        if: env.NOTARIZE == '1'
        env:
          API_KEY: ${{ secrets.APPLE_API_KEY }}
          KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          set -euo pipefail
          echo "$API_KEY" > key.p8
          ditto -c -k --keepParent "dist/OG Files.app" notarize.zip
          xcrun notarytool submit notarize.zip --key key.p8 --key-id "$KEY_ID" --issuer "$ISSUER" --wait
          xcrun stapler staple "dist/OG Files.app"
          rm key.p8 notarize.zip
      - name: Package (.dmg + .zip)
        run: |
          set -euo pipefail
          N=og-files-$V-macos-${{ matrix.arch }}
          ditto -c -k --keepParent "dist/OG Files.app" "dist/$N.zip"
          mkdir -p dmg && cp -R "dist/OG Files.app" dmg/ && ln -s /Applications dmg/Applications
          hdiutil create -volname "OG Files" -srcfolder dmg -ov -format UDZO "dist/$N.dmg"
          if [ "${NOTARIZE:-}" = 1 ]; then xcrun stapler staple "dist/$N.dmg" || true; fi
          ls -la dist
      - uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.arch }}
          path: |
            dist/*.dmg
            dist/*.zip

  windows:
    name: Windows ${{ matrix.arch }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x64, os: windows-latest, mpv: x86_64 }
          - { arch: arm64, os: windows-11-arm, mpv: aarch64 }
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --locked --release
      - name: libmpv to bundle (mpv-winbuild)
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # prebuilt libmpv (GPL, all codecs linked in) from the widely used
          # zhongfly/mpv-winbuild CI; the release tag is recorded in the zip
          $tag = gh release view --repo zhongfly/mpv-winbuild --json tagName -q .tagName
          gh release download $tag --repo zhongfly/mpv-winbuild --pattern 'mpv-dev-${{ matrix.mpv }}-2*.7z' --dir mpvdev
          7z x (Get-ChildItem mpvdev/*.7z | Select-Object -First 1).FullName -ompvdev/x
          "libmpv: mpv-winbuild $tag (https://github.com/zhongfly/mpv-winbuild), GPL-2.0-or-later" | Out-File THIRD-PARTY.txt
      - name: Stage + portable .zip
        shell: pwsh
        run: |
          $V = (cargo pkgid) -replace '.*[#@]', ''
          $N = "og-files-$V-windows-${{ matrix.arch }}"
          New-Item -ItemType Directory -Force "stage", "dist" | Out-Null
          Copy-Item target/release/og-files.exe, packaging/icons/og-files.ico, THIRD-PARTY.txt stage/
          Copy-Item LICENSE stage/LICENSE.txt
          Copy-Item (Get-ChildItem mpvdev/x -Recurse -Filter libmpv-2.dll | Select-Object -First 1).FullName stage/
          if (Test-Path README.md) { Copy-Item README.md stage/ }
          Compress-Archive -Path "stage/*" -DestinationPath "dist/$N.zip"
          "$V" | Out-File -NoNewline stage/VERSION
      - uses: actions/upload-artifact@v4
        with:
          name: windows-${{ matrix.arch }}
          path: dist/*.zip
      - uses: actions/upload-artifact@v4
        with:
          name: windows-stage-${{ matrix.arch }}
          path: stage
          retention-days: 1

  windows-installer:
    name: Windows installers
    needs: windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: windows-stage-*
          path: stages
      - name: Inno Setup
        run: choco install innosetup -y --no-progress
      - name: Build installers
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          foreach ($arch in "x64", "arm64") {
            $src = (Resolve-Path "stages/windows-stage-$arch").Path
            $V = Get-Content "$src/VERSION"
            & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" /Q "/DAppVersion=$V" "/DArch=$arch" "/DSrcDir=$src" "/O$PWD\dist" packaging/windows/og-files.iss
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          Get-ChildItem dist
      - uses: actions/upload-artifact@v4
        with:
          name: windows-installers
          path: dist/*.exe

  publish:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [linux, arch, macos, windows, windows-installer]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: "{linux-*,arch,macos-*,windows-x64,windows-arm64,windows-installers}"
          merge-multiple: true
      - name: Checksums
        run: cd dist && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > notes.md <<'EOF'
          ## Downloads

          **Linux** (x86_64 and aarch64)
          - `.AppImage` — any distro, everything bundled: `chmod +x` and run
          - `.deb` — Debian 13+, Ubuntu 24.04+ (`sudo apt install ./og-files_*.deb`)
          - `.rpm` — Fedora 40+, openSUSE Tumbleweed (`sudo dnf install ./og-files-*.rpm`)
          - `.pkg.tar.zst` — Arch (`sudo pacman -U og-files-bin-*.pkg.tar.zst`); `PKGBUILD` for the AUR
          - `.tar.gz` — portable: unpack and run `./install.sh` (installs for your user, no root)

          **macOS** — `.dmg` for Apple Silicon (`arm64`) or Intel (`x86_64`)

          **Windows** — `-setup.exe` installer or portable `.zip`, for x64 or ARM64

          Video playback uses libmpv: bundled in the AppImage, macOS and Windows downloads; install `mpv`/`libmpv` for the .deb, .rpm, Arch and tarball builds.
          OG Files is licensed under MPL-2.0; the bundled libmpv is GPL.
          EOF
          gh release create "${{ github.ref_name }}" dist/* \
            --repo "${{ github.repository }}" --title "OG Files ${{ github.ref_name }}" \
            --notes-file notes.md
