name: Mac App Store

# Run by hand (Actions > Mac App Store > Run workflow): builds OG Files for
# Apple silicon and Intel with `--features appstore` (sandboxed, no libmpv or
# FFmpeg: video plays through AVFoundation), signs it with the Apple
# Distribution certificate, wraps it in a .pkg signed with the Mac Installer
# certificate, validates it with Apple and (unless "upload" is off) uploads
# it to App Store Connect, where it shows up in TestFlight. Never submits for
# review. Secrets: see packaging/macos/appstore/README.md.
on:
  workflow_dispatch:
    inputs:
      version:
        description: Marketing version (must match the version in App Store Connect)
        default: "1.0"
      upload:
        description: Upload to App Store Connect (off = build, sign and validate only)
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  appstore:
    runs-on: macos-latest
    env:
      APP: dist/OG Files.app
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2

      - name: Build (universal, App Store variant)
        env:
          MACOSX_DEPLOYMENT_TARGET: "11.0"
        run: |
          for t in aarch64-apple-darwin x86_64-apple-darwin; do
            cargo build --locked --release --no-default-features --features appstore --target $t
          done

      - name: Signing keychain
        env:
          DIST_P12: ${{ secrets.APPLE_DIST_CERTIFICATE }}
          DIST_PW: ${{ secrets.APPLE_DIST_CERTIFICATE_PASSWORD }}
          INST_P12: ${{ secrets.APPLE_INSTALLER_CERTIFICATE }}
          INST_PW: ${{ secrets.APPLE_INSTALLER_CERTIFICATE_PASSWORD }}
          KC_PW: ${{ github.run_id }}${{ github.run_attempt }}
        run: |
          set -euo pipefail
          security create-keychain -p "$KC_PW" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$KC_PW" build.keychain
          security set-keychain-settings -t 3600 -u build.keychain
          echo "$DIST_P12" | base64 --decode > dist.p12
          echo "$INST_P12" | base64 --decode > inst.p12
          security import dist.p12 -k build.keychain -P "$DIST_PW" -T /usr/bin/codesign -T /usr/bin/productbuild
          security import inst.p12 -k build.keychain -P "$INST_PW" -T /usr/bin/codesign -T /usr/bin/productbuild
          rm dist.p12 inst.p12
          security set-key-partition-list -S apple-tool:,apple:,codesign:,productbuild: -s -k "$KC_PW" build.keychain
          security find-identity -v build.keychain

      - name: Assemble the app
        env:
          PROFILE: ${{ secrets.APPLE_MAC_PROVISIONING_PROFILE }}
        run: |
          set -euo pipefail
          mkdir -p "$APP/Contents/MacOS" "$APP/Contents/Resources"
          lipo -create -output "$APP/Contents/MacOS/og-files" \
            target/aarch64-apple-darwin/release/og-files target/x86_64-apple-darwin/release/og-files
          # Private APIs App Review refuses (Guideline 2.5.1): fail here first.
          if nm -u "$APP/Contents/MacOS/og-files" | grep -E "_CGS[A-Z]"; then
            echo "::error::the binary references private CoreGraphics (CGS) APIs"; exit 1
          fi
          # Nothing GPL may ship here: no libmpv, no FFmpeg.
          if otool -L "$APP/Contents/MacOS/og-files" | grep -Ei "libmpv|libav(codec|format|util)"; then
            echo "::error::the App Store binary links libmpv/FFmpeg"; exit 1
          fi
          # The build number must grow with every upload.
          sed -e "s/__VERSION__/${{ inputs.version }}/" -e "s/__BUILD__/${{ github.run_number }}/" \
            packaging/macos/appstore/Info.plist.in > "$APP/Contents/Info.plist"
          printf 'APPL????' > "$APP/Contents/PkgInfo"
          cp packaging/macos/appstore/PrivacyInfo.xcprivacy "$APP/Contents/Resources/"
          cp LICENSE "$APP/Contents/Resources/"
          # The icon: an asset catalog (Assets.car) and AppIcon.icns.
          SET=build/Assets.xcassets/AppIcon.appiconset
          mkdir -p "$SET"
          for s in 16 32 128 256 512; do
            sips -z $s $s packaging/macos/icon-mac-1024.png --out "$SET/icon_${s}.png" >/dev/null
            d=$((s * 2))
            sips -z $d $d packaging/macos/icon-mac-1024.png --out "$SET/icon_${s}@2x.png" >/dev/null
          done
          python3 - "$SET" <<'PY'
          import json, sys
          images = []
          for s in (16, 32, 128, 256, 512):
              for k, suffix in ((1, ""), (2, "@2x")):
                  images.append({"idiom": "mac", "size": f"{s}x{s}", "scale": f"{k}x",
                                 "filename": f"icon_{s}{suffix}.png"})
          json.dump({"images": images, "info": {"version": 1, "author": "og-files"}},
                    open(sys.argv[1] + "/Contents.json", "w"), indent=1)
          json.dump({"info": {"version": 1, "author": "og-files"}},
                    open(sys.argv[1] + "/../Contents.json", "w"))
          PY
          xcrun actool build/Assets.xcassets --compile "$APP/Contents/Resources" \
            --platform macosx --minimum-deployment-target 11.0 --app-icon AppIcon \
            --output-partial-info-plist build/icon-info.plist
          ls "$APP/Contents/Resources"
          echo "$PROFILE" | base64 --decode > "$APP/Contents/embedded.provisionprofile"

      - name: Sign
        env:
          IDENTITY: ${{ secrets.APPLE_DIST_SIGNING_IDENTITY }}
        run: |
          set -euo pipefail
          codesign --force --timestamp --options runtime \
            --entitlements packaging/macos/appstore/OGFiles.entitlements \
            --sign "$IDENTITY" "$APP"
          codesign --verify --strict --verbose=2 "$APP"
          codesign -d --entitlements - "$APP"

      - name: Package
        env:
          IDENTITY: ${{ secrets.APPLE_INSTALLER_SIGNING_IDENTITY }}
        run: |
          productbuild --component "$APP" /Applications --sign "$IDENTITY" OGFiles-appstore.pkg
          pkgutil --check-signature OGFiles-appstore.pkg

      - uses: actions/upload-artifact@v4
        with:
          name: OGFiles-appstore-pkg
          path: OGFiles-appstore.pkg
          retention-days: 14

      - name: Validate and upload
        env:
          API_KEY: ${{ secrets.APPLE_API_KEY }}
          KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.appstoreconnect/private_keys"
          echo "$API_KEY" > "$HOME/.appstoreconnect/private_keys/AuthKey_${KEY_ID}.p8"
          xcrun altool --validate-app -f OGFiles-appstore.pkg -t macos --apiKey "$KEY_ID" --apiIssuer "$ISSUER"
          if [ "${{ inputs.upload }}" = "true" ]; then
            xcrun altool --upload-app -f OGFiles-appstore.pkg -t macos --apiKey "$KEY_ID" --apiIssuer "$ISSUER"
          fi
