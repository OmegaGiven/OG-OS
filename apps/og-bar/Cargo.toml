[package]
name = "og-bar"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "og-bar"
path = "src/main.rs"

[[bin]]
name = "tray-spike"
path = "src/bin/tray_spike.rs"

[dependencies]
system-tray = "0.8"
og-config = { path = "../../crates/og-config" }
og-drag = { path = "../../crates/og-drag" }
og-theme = { path = "../../crates/og-theme" }
iced = { version = "0.13", default-features = false, features = ["tiny-skia", "advanced", "tokio", "image"] }
iced_layershell = "0.13.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["process", "io-util", "rt", "time", "sync", "net"] }
futures = "0.3"
zbus = { version = "5", default-features = false, features = ["tokio"] }
inotify = "0.11"
chrono = "0.4"
chrono-tz = "0.10"
libc = "0.2"

