[package]
name = "og-wallpaper-studio"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "og-wallpaper-studio"
path = "src/main.rs"

[dependencies]
og-config = { path = "../../crates/og-config" }
og-theme = { path = "../../crates/og-theme" }
og-wallpaper-core = { path = "../../crates/og-wallpaper-core" }
iced = { version = "0.13", default-features = false, features = ["tiny-skia", "canvas", "image"] }
rfd = "0.15"
