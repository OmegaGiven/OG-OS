[package]
name = "og-notify"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "og-notify"
path = "src/main.rs"

[dependencies]
og-wayland = { path = "../../crates/og-wayland" }
serde_json = "1"
zbus = "5"
rand = "0.8"
tokio = { version = "1", features = ["rt"] }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
